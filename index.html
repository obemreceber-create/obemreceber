<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>o bem receber | consultoria e treinamento</title>
  <!-- importação da fonte montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --marrom: #3d2c1d;
      --caqui: #8c7a5b;
      --caramelo: #d99b43;
      --bege: #e6d7c3;
      --aveia: #f4efe6;
      --verde-musgo: #556b2f;
      --texto: #3d2c1d;
      --bg: #f4efe6;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; text-transform: lowercase; }
    
    body {
      background-color: var(--bg);
      color: var(--texto);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* fontes dedicadas */
    .brand-title {
      font-family: 'Georgia', serif;
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1, h2, h3, h4, th, .btn {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }

    header {
      background: var(--marrom);
      color: var(--bege);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(61,44,29,0.1);
    }

    header h1 { font-size: 1.6rem; color: var(--bege); }
    .user-info { font-size: 0.85rem; background: rgba(230,215,195,0.15); padding: 0.3rem 0.9rem; border-radius: 20px; color: var(--bege); }

    .container { max-width: 1100px; margin: auto; padding: 2rem 1rem; width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }

    /* tela de login descontraída e limpa */
    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      padding: 2.8rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(61,44,29,0.08);
      border: 1px solid var(--bege);
    }

    .login-box h2 { text-align: center; margin-bottom: 0.3rem; color: var(--marrom); font-size: 1.8rem; }
    .login-box p { text-align: center; font-size: 0.85rem; color: var(--caqui); margin-bottom: 2rem; font-weight: 400; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.85rem; color: var(--marrom); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--bege);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Montserrat', sans-serif;
      background: var(--aveia);
      color: var(--texto);
      transition: all 0.2s;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--caramelo);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(217,155,67,0.15);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--marrom);
      color: var(--bege);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
      letter-spacing: 0.5px;
    }

    .btn:hover { background: var(--caqui); color: white; }
    .btn-secondary { background: var(--caqui); width: auto; padding: 0.35rem 0.8rem; font-size: 0.8rem; margin-top: 0; }

    .quick-access-box {
      margin-top: 1.5rem;
      padding-top: 1.2rem;
      border-top: 1px dashed var(--bege);
      text-align: center;
    }

    .quick-access-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--caqui);
      margin-bottom: 0.8rem;
    }

    .quick-btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn-role {
      flex: 1;
      padding: 0.6rem 0.4rem;
      font-size: 0.75rem;
      background: var(--aveia);
      color: var(--marrom);
      border: 1px solid var(--bege);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-role:hover {
      background: var(--caramelo);
      color: white;
      border-color: var(--caramelo);
    }

    /* navegação horizontal do gestor */
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--bege);
      padding-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.6rem 1rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--caqui);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--marrom);
      color: var(--bege);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(61,44,29,0.03);
      border: 1px solid var(--bege);
      width: 100%;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1
