<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>o bem receber | consultoria e treinamento</title>
  <!-- importação da fonte montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --marrom: #3d2c1d;
      --caqui: #8c7a5b;
      --caramelo: #d99b43;
      --bege: #e6d7c3;
      --aveia: #f4efe6;
      --verde-musgo: #556b2f;
      --texto: #3d2c1d;
      --bg: #f4efe6;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; text-transform: lowercase; }
    
    body {
      background-color: var(--bg);
      color: var(--texto);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* fontes dedicadas */
    .brand-title {
      font-family: 'Georgia', serif;
      font-weight: 700;
      letter-spacing: -1px;
    }

    h1, h2, h3, h4, th, .btn {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }

    header {
      background: var(--marrom);
      color: var(--bege);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(61,44,29,0.1);
    }

    header h1 { font-size: 1.6rem; color: var(--bege); }
    .user-info { font-size: 0.85rem; background: rgba(230,215,195,0.15); padding: 0.3rem 0.9rem; border-radius: 20px; color: var(--bege); }

    .container { max-width: 1100px; margin: auto; padding: 2rem 1rem; width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }

    /* tela de login descontraída e limpa */
    .login-box {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      padding: 2.8rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(61,44,29,0.08);
      border: 1px solid var(--bege);
    }

    .login-box h2 { text-align: center; margin-bottom: 0.3rem; color: var(--marrom); font-size: 1.8rem; }
    .login-box p { text-align: center; font-size: 0.85rem; color: var(--caqui); margin-bottom: 2rem; font-weight: 400; }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.85rem; color: var(--marrom); }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--bege);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Montserrat', sans-serif;
      background: var(--aveia);
      color: var(--texto);
      transition: all 0.2s;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--caramelo);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(217,155,67,0.15);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--marrom);
      color: var(--bege);
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 0.5rem;
      letter-spacing: 0.5px;
    }

    .btn:hover { background: var(--caqui); color: white; }
    .btn-secondary { background: var(--caqui); width: auto; padding: 0.35rem 0.8rem; font-size: 0.8rem; margin-top: 0; }

    /* navegação horizontal do gestor */
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--bege);
      padding-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.6rem 1rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--caqui);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--marrom);
      color: var(--bege);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(61,44,29,0.03);
      border: 1px solid var(--bege);
      width: 100%;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background: var(--aveia);
      border-left: 4px solid var(--caramelo);
      padding: 1.2rem;
      border-radius: 8px;
    }

    .metric-card h4 { color: var(--marrom); font-size: 0.8rem; font-weight: 700; }
    .metric-card .value { font-size: 1.6rem; font-weight: 700; color: var(--marrom); margin-top: 0.3rem; font-family: 'Georgia', serif; }

    .alert-box {
      background: #fdf8f0;
      border: 1px solid #fae8d2;
      border-left: 4px solid var(--caramelo);
      padding: 1.2rem;
      border-radius: 8px;
      margin-top: 1rem;
    }

    .table-container { width: 100%; overflow-x: auto; margin-top: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid var(--bege); }
    th { color: var(--marrom); font-weight: 700; background: var(--aveia); }

    .quiz-option {
      display: block;
      margin: 0.6rem 0;
      padding: 0.8rem 1rem;
      border: 1px solid var(--bege);
      border-radius: 8px;
      cursor: pointer;
      background: var(--aveia);
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .quiz-option:hover { background: #e2d2be; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- cabeçalho -->
  <header id="appHeader" class="hidden">
    <h1 class="brand-title">o bem receber</h1>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span class="user-info" id="userInfo">usuário: -</span>
      <button class="btn btn-secondary" onclick="logout()">sair</button>
    </div>
  </header>

  <div class="container" id="mainContainer">
    
    <!-- 1 & 2. TELA DE LOGIN -->
    <div id="loginScreen" class="login-box">
      <h2 class="brand-title">o bem receber</h2>
      <p>consultoria e treinamento sobre a arte do bem receber</p>

      <div class="form-group">
        <label for="username">usuário ou e-mail</label>
        <input type="text" id="username" placeholder="digite seu usuário">
      </div>

      <div class="form-group">
        <label for="password">senha</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="simulatedRole">perfil de acesso</label>
        <select id="simulatedRole">
          <option value="student">aluno / colaborador (método, etiqueta & quizzes)</option>
          <option value="client">cliente (dono/gestor: apenas gráficos & resultados)</option>
          <option value="manager">gestor / consultor (painel geral & auditoria)</option>
        </select>
      </div>

      <button class="btn" onclick="login()">entrar</button>
    </div>

    <!-- 3A. PAINEL DO ALUNO / COLABORADOR -->
    <div id="studentPanel" class="hidden" style="width: 100%;">
      <div class="card">
        <h2 class="brand-title" style="font-size: 1.6rem; margin-bottom: 0.5rem;">módulo I & II: o método do bem receber</h2>
